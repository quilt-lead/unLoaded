[project]
name = "calc-graph"
version = "0.1.0"
requires-python = ">=3.12"
description = "Map a structural BIM element graph to its calc package graph (hackathon v1)"
dependencies = [
    "fastapi>=0.163.0",
    "ifcopenshell>=0.9.0.post1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pymupdf>=2.1",
    "pynitefea>=3.2.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
calc-graph = "calcgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/calcgraph", "synth"]
