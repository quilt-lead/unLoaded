[project]
name = "calc-graph"
version = "0.1.0"
requires-python = ">=3.12"
description = "Map a structural BIM element graph to its calc package graph (hackathon v1)"
dependencies = [
    "fastapi>=0.163.0",
    "ifcopenshell>=0.9.0.post1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pint==0.25.3",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pynitefea>=3.2.1",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
    "handcalcs==1.11.0",
    "weasyprint==70.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# lazy-imported by backend/calcgraph/ai/providers/anthropic_provider.py (off unless enabled)
ai = ["anthropic>=0.40"]

[project.scripts]
calc-graph = "calcgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/calcgraph", "synth"]
