[project]
name = "calcgraph-windows-bridge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Runs ON a Windows desk: exposes BHoM (pythonnet) and CSI OAPI to the calc-graph Mac backend over an SSH tunnel"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pythonnet>=3.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calcgraph_bridge"]
