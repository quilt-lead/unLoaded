<script type="module">
// ---- data.js
// Loads the four JSON files and works out stepper stops from them.
const NAMES = ["documents", "elements", "groups", "calcs", "links"];

async function loadData(base = "data/") {
  // the double-click build (viewers/) ships the data as a script that sets window.CALC_DATA
  const parts = window.CALC_DATA ? NAMES.map((n) => window.CALC_DATA[n]) : await Promise.all(
    NAMES.map((n) => fetch(base + n + ".json").then((r) => { if (!r.ok) throw new Error(`${n}.json: ${r.status}`); return r.json(); }))
  );
  const D = Object.fromEntries(NAMES.map((n, i) => [n, parts[i][n]]));
  D.meta = parts[0].meta;
  D.doc = Object.fromEntries(D.documents.map((d) => [d.id, d]));
  D.el = Object.fromEntries(D.elements.map((e) => [e.id, e]));
  D.group = Object.fromEntries(D.groups.map((g) => [g.id, g]));
  D.calc = Object.fromEntries(D.calcs.map((c) => [c.id, c]));
  D.linksBySource = {};
  D.linksByCalc = {};
  for (const l of D.links) {
    (D.linksBySource[l.source.id] ??= []).push(l);
    (D.linksByCalc[l.calc] ??= []).push(l);
  }
  return D;
}

const byConf = (a, b) => b.confidence - a.confidence;

/** Links for an element: its own, plus its typical group's. */
function linksForElement(D, el) {
  // design links first (they size the member), then loads/reference; each by confidence
  return [...(D.linksBySource[el.id] || []), ...(el.group ? D.linksBySource[el.group] || [] : [])]
    .sort((a, b) => (a.role === "design" ? 0 : 1) - (b.role === "design" ? 0 : 1) || byConf(a, b));
}

/** Colour/review status of an item: the best *design* link. A loads-only link doesn't count as being designed. */
function bestBand(links) {
  const design = links.filter((l) => l.role === "design");
  if (!design.length) return "none";
  return design.slice().sort(byConf)[0].band;
}

function bestDesign(links) {
  return links.filter((l) => l.role === "design").sort(byConf)[0] || null;
}

function sourceName(D, src) {
  if (src.kind === "group") return D.group[src.id]?.title ?? src.id;
  return D.el[src.id]?.tag ?? src.id;
}

function sourceElements(D, src) {
  return src.kind === "group" ? D.group[src.id].members.map((id) => D.el[id]) : [D.el[src.id]];
}

/** Calc-side stops for a link: the calc spans that hold evidence (all spans when there is none). */
function calcStops(D, link) {
  const c = D.calc[link.calc];
  const withHits = new Set(link.hits.map((h) => h.span));
  let idx = c.spans.map((_, i) => i);
  if (withHits.size) idx = idx.filter((i) => withHits.has(i));
  return idx.map((i) => ({ kind: "calc", doc: c.doc, span: i, title: c.spans[i].title || c.title, regions: c.spans[i].regions, link }));
}

/** Drawing-side stops for a link: every place its element (or every member of its group) is drawn. */
function drawingStops(D, link) {
  const occ = sourceElements(D, link.source).flatMap((e) => e.occurrences.map((o, k) => ({ ...o, el: e, k })));
  occ.sort((a, b) => a.page - b.page || a.rect[1] - b.rect[1] || a.rect[0] - b.rect[0]);
  return occ.map((o) => ({ kind: "drawing", doc: o.doc, title: `${o.el.tag}${o.el.grid ? " · " + o.el.grid : ""}`, regions: [{ page: o.page, rect: o.rect }], elId: o.el.id, occ: o.k, link }));
}

/** Stops for "go to the detail sheet" on a callout. */
function refStops(D, el) {
  return (el.refs || []).map((r) => ({ kind: "sheet", sheet: r.sheet, doc: r.doc, title: `${r.sheet} ${r.title || ""}`.trim(), regions: [{ page: r.page, rect: [0.005, 0.005, 0.995, 0.995], fullPage: true }] }));
}

function pageLabel(D, docId, page) {
  return D.doc[docId].pages[page - 1]?.label || null;
}

/** "Page 57" / "Pages 76–78", with sheet numbers when the pages have them. */
function stopLabel(D, stop) {
  const pages = stop.regions.map((r) => r.page);
  const a = Math.min(...pages), b = Math.max(...pages);
  const la = pageLabel(D, stop.doc, a), lb = pageLabel(D, stop.doc, b);
  const pg = a === b ? `Page ${a}` : `Pages ${a}–${b}`;
  const sh = la ? (a === b || !lb || la === lb ? `${D.doc[stop.doc].kind === "drawings" ? "" : "Sheet "}${la}` : `Sheets ${la}–${lb}`) : "";
  return { pg, sh, short: sh ? `${sh} · ${a === b ? "p. " + a : "p. " + a + "–" + b}` : pg, a, b };
}

const pct = (c) => Math.round(c * 100) + "%";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ROLE = { design: "design", loads: "loads", reference: "reference" };

// ---- stepper.js
// Stepper: "‹ 2 of 5 · label ›". Clicking the body goes to the next stop (wrapping); arrows go back/forward.
// With one stop it shows "1 of 1 · label" with no arrows; clicking it opens that stop again.

function makeStepper({ count, label, onGo, index = -1, visited = new Set() }) {
  const root = document.createElement("div");
  let cur = index;
  const single = count <= 1;
  root.className = "stepper" + (single ? " single" : "");
  const render = () => {
    const shown = cur < 0 ? 0 : cur;
    const text = `<span class="count">${cur < 0 && !single ? `${count} locations` : `${shown + 1} of ${count}`}</span><span class="lbl">${esc(label(shown))}</span>`;
    const dots = !single && count <= 24
      ? `<span class="visits">${Array.from({ length: count }, (_, i) => `<i class="${i === cur ? "cur" : visited.has(i) ? "v" : ""}"></i>`).join("")}</span>` : "";
    root.innerHTML = single
      ? `<div class="body">${text}</div>`
      : `<button class="arr prev" title="Previous">‹</button><button class="body" title="Next location">${text}${dots}</button><button class="arr next" title="Next">›</button>`;
  };
  const go = (i) => {
    cur = (i + count) % count;
    visited.add(cur);
    render();
    onGo(cur);
  };
  root.addEventListener("click", (ev) => {
    ev.stopPropagation();
    if (single) { go(0); return; } // one stop: nothing to step through, but each click still (re)opens it
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.classList.contains("prev")) go(cur < 0 ? count - 1 : cur - 1);
    else go(cur < 0 ? 0 : cur + 1);
  });
  render();
  return { el: root, go, get index() { return cur; }, set(i) { cur = i; visited.add(i); render(); } };
}

// ---- pdfpane.js
// A continuous-scroll PDF pane (PDF.js) with zoom and named overlay layers.
// Overlay rects are fractions of the page (x0, y0, x1, y1), so they follow zoom without recalculation.
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";

const docCache = new Map(); // url -> Promise<{pdf, sizes}>
const MAX_CANVAS_PX = 14e6;

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function loadDoc(url, docId) {
  if (!docCache.has(url)) {
    docCache.set(url, (async () => {
      // the double-click build (viewers/) ships each PDF as a script that sets window.PDF_DATA[docId]
      const packed = window.PDF_DATA?.[docId];
      const src = packed ? { data: b64ToBytes(packed) } : { url, disableAutoFetch: true };
      const pdf = await pdfjsLib.getDocument(src).promise;
      const sizes = await Promise.all(
        Array.from({ length: pdf.numPages }, (_, i) => pdf.getPage(i + 1).then((p) => { const v = p.getViewport({ scale: 1 }); return [v.width, v.height]; }))
      );
      return { pdf, sizes };
    })());
  }
  return docCache.get(url);
}

class PdfPane {
  constructor(scroller, { onPage } = {}) {
    this.scroller = scroller;
    this.onPage = onPage;
    this.zoom = 1;
    this.layers = {};
    this.pageEls = [];
    this.url = null;
    this.io = new IntersectionObserver((ents) => this._onIntersect(ents), { root: scroller, rootMargin: "800px 0px" });
    this.visible = new Set();
    scroller.addEventListener("scroll", () => this._reportPage(), { passive: true });
    this._w = 0;
    new ResizeObserver(() => {
      if (!this.pdf || Math.abs(scroller.clientWidth - this._w) < 2) return;
      this._w = scroller.clientWidth;
      const t = this._target;
      this._layout(!t || Date.now() - t.at > 2500);
      // a resize right after a jump (e.g. the pane just opened) must not lose that jump
      if (t && Date.now() - t.at <= 2500) this.scrollTo(t.page, t.rect, { ...t.opts, smooth: false });
    }).observe(scroller);
  }

  async open(url, docId) {
    if (this.url === url) return;
    this.url = url;
    this.docId = docId;
    this.scroller.innerHTML = '<div class="empty" style="padding:20px">Loading PDF…</div>';
    const { pdf, sizes } = await loadDoc(url, docId);
    if (this.url !== url) return;
    this.pdf = pdf;
    this.sizes = sizes;
    const widths = sizes.map((s) => s[0]).sort((a, b) => a - b);
    this.refWidth = widths[Math.floor(widths.length / 2)];
    this.scroller.innerHTML = "";
    this.io.disconnect();
    this.visible.clear();
    this.pageEls = sizes.map((_, i) => {
      const d = document.createElement("div");
      d.className = "page";
      d.dataset.page = i + 1;
      d.innerHTML = `<span class="pno">${i + 1}</span><div class="overlay"></div>`;
      this.scroller.appendChild(d);
      this.io.observe(d);
      return d;
    });
    this.zoom = 1;
    this._w = this.scroller.clientWidth;
    this._layout(false);
    for (const name of Object.keys(this.layers)) this._paintLayer(name);
  }

  get fitScale() { return Math.max(0.05, (this.scroller.clientWidth - 28) / this.refWidth); }
  get scale() { return this.fitScale * this.zoom; }

  _layout(keepPosition) {
    const anchor = keepPosition ? this._anchor() : null;
    this.pageEls.forEach((d, i) => {
      const [w, h] = this.sizes[i];
      // same scale for every page, except oversize pages (e.g. a fold-out sheet) which fit the pane width
      const s = Math.min(this.scale, ((this.scroller.clientWidth - 28) / w) * this.zoom);
      d.style.width = `${w * s}px`;
      d.style.height = `${h * s}px`;
      d.dataset.scale = s;
    });
    for (const i of this.visible) this._render(i);
    if (anchor) this._restore(anchor);
  }

  _anchor() {
    const p = this.currentPage();
    const d = this.pageEls[p - 1];
    if (!d) return null;
    return { p, fy: (this.scroller.scrollTop - d.offsetTop + this.scroller.clientHeight / 2) / d.offsetHeight, fx: (this.scroller.scrollLeft + this.scroller.clientWidth / 2) / this.scroller.scrollWidth };
  }

  _restore(a) {
    const d = this.pageEls[a.p - 1];
    this.scroller.scrollTop = d.offsetTop + a.fy * d.offsetHeight - this.scroller.clientHeight / 2;
    this.scroller.scrollLeft = a.fx * this.scroller.scrollWidth - this.scroller.clientWidth / 2;
  }

  setZoom(z, keep = true) {
    z = Math.min(8, Math.max(0.25, z));
    if (Math.abs(z - this.zoom) < 1e-3) return;
    this.zoom = z;
    this._layout(keep);
  }

  _onIntersect(ents) {
    for (const e of ents) {
      const i = +e.target.dataset.page - 1;
      if (e.isIntersecting) { this.visible.add(i); this._render(i); }
      else { this.visible.delete(i); this._drop(i); }
    }
  }

  _drop(i) {
    const d = this.pageEls[i];
    const c = d.querySelector("canvas");
    if (c) { c.width = c.height = 0; c.remove(); }
    d.dataset.rendered = "";
  }

  async _render(i) {
    const d = this.pageEls[i];
    const s = +d.dataset.scale;
    const key = `${s.toFixed(4)}`;
    if (d.dataset.rendered === key || d.dataset.rendering === key) return;
    d.dataset.rendering = key;
    const page = await this.pdf.getPage(i + 1);
    const [w, h] = this.sizes[i];
    let out = (window.devicePixelRatio || 1) * s;
    if (w * h * out * out > MAX_CANVAS_PX) out = Math.sqrt(MAX_CANVAS_PX / (w * h));
    const vp = page.getViewport({ scale: out });
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    try {
      d._task?.cancel();
      d._task = page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
      await d._task.promise;
    } catch (e) {
      if (e?.name !== "RenderingCancelledException") console.warn(e);
      return;
    }
    if (d.dataset.rendering !== key || !this.visible.has(i)) return;
    d.querySelector("canvas")?.remove();
    d.prepend(canvas);
    d.dataset.rendered = key;
    d.dataset.rendering = "";
  }

  currentPage() {
    const mid = this.scroller.scrollTop + this.scroller.clientHeight * 0.35;
    let p = 1;
    for (const d of this.pageEls) { if (d.offsetTop <= mid) p = +d.dataset.page; else break; }
    return p;
  }

  _reportPage() {
    const p = this.currentPage();
    if (p !== this._lastPage) { this._lastPage = p; this.onPage?.(p); }
  }

  /** Scroll so a fractional rect on a page is in view. zoomFor: fraction of pane width the rect should take. */
  scrollTo(page, rect, { zoomFor = null, maxZoom = 6, smooth = true, topMargin = 70 } = {}) {
    const d = this.pageEls[page - 1];
    if (!d) return;
    this._target = { page, rect, opts: { zoomFor, maxZoom, topMargin }, at: Date.now() };
    if (zoomFor) {
      const [w] = this.sizes[page - 1];
      const rw = Math.max(0.01, rect[2] - rect[0]);
      const z = (zoomFor * (this.scroller.clientWidth - 28)) / (rw * w * this.fitScale);
      this.setZoom(Math.min(maxZoom, Math.max(1, z)), false);
    }
    const top = d.offsetTop + rect[1] * d.offsetHeight - topMargin;
    const cx = d.offsetLeft + ((rect[0] + rect[2]) / 2) * d.offsetWidth;
    this.scroller.scrollTo({ top, left: cx - this.scroller.clientWidth / 2, behavior: smooth ? "smooth" : "auto" });
  }

  /** items: [{page, rect, cls, html, title, attrs, on:{click,...}}] */
  setLayer(name, items) {
    this.layers[name] = items;
    this._paintLayer(name);
  }

  _paintLayer(name) {
    this.scroller.querySelectorAll(`.ov[data-layer="${name}"]`).forEach((n) => n.remove());
    const items = this.layers[name] || [];
    for (const it of items) {
      const d = this.pageEls[it.page - 1];
      if (!d) continue;
      const n = document.createElement("div");
      n.className = "ov " + (it.cls || "");
      n.dataset.layer = name;
      const [x0, y0, x1, y1] = it.rect;
      if (it.point) { n.style.left = `${x0 * 100}%`; n.style.top = `${y0 * 100}%`; }
      else Object.assign(n.style, { left: `${x0 * 100}%`, top: `${y0 * 100}%`, width: `${(x1 - x0) * 100}%`, height: `${(y1 - y0) * 100}%` });
      if (it.html) n.innerHTML = it.html;
      if (it.title) n.title = it.title;
      for (const [k, v] of Object.entries(it.attrs || {})) n.dataset[k] = v;
      for (const [ev, fn] of Object.entries(it.on || {})) n.addEventListener(ev, fn);
      d.querySelector(".overlay").appendChild(n);
    }
  }

  nodes(name, sel = "") { return [...this.scroller.querySelectorAll(`.ov[data-layer="${name}"]${sel}`)]; }
}

// ---- pagenav.js
// Page list sidebar: every page of the open document, each expandable to the links found on it.
// Clicking a page (label or title) goes to it; the caret only expands/collapses. Clicking a link row shows that
// link where it sits in this window's PDF (the element on the drawing, or the calc box on the calc page) – it does
// not follow the link to the other viewer.

const store = {
  get(k, d) { try { const v = localStorage.getItem("calcviewer." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("calcviewer." + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

/** Rows for each page: [{band, from, to, pct, at}] – `at` says where the link sits on that page:
 *  drawings: {page, el, occ, link?}   calcs: {page, calc, span, link?} */
function linksByPage(D, mode, docId) {
  const pages = new Map();
  const add = (p, row, key) => {
    const list = pages.get(p) || (pages.set(p, []), pages.get(p));
    if (!list.some((r) => r.key === key)) list.push({ ...row, key });
  };
  if (mode === "drawings") {
    for (const e of D.elements) {
      const links = linksForElement(D, e);
      const from = `${e.tag}${e.grid ? " · " + e.grid : ""}`;
      e.occurrences.forEach((o, occ) => {
        if (o.doc !== docId) return;
        const at = { page: o.page, el: e.id, occ };
        for (const r of e.refs || []) add(o.page, { band: "none", from, to: `→ Detail sheet ${r.sheet}`, pct: "", at: { ...at, ref: r.sheet } }, `${e.id}|${occ}|ref|${r.sheet}`);
        for (const l of links) add(o.page, { band: l.band, from, to: `→ ${D.calc[l.calc].title} (${l.role})`, pct: pct(l.confidence), at: { ...at, link: l.id } }, `${e.id}|${occ}|${l.id}`);
        if (!links.length && !(e.refs || []).length) add(o.page, { band: "none", from, to: "→ no calc found", pct: "", none: true, at }, `${e.id}|${occ}|none`);
      });
    }
  } else {
    for (const c of D.calcs.filter((c) => c.doc === docId)) {
      const links = (D.linksByCalc[c.id] || []).slice().sort((a, b) => b.confidence - a.confidence);
      c.spans.forEach((s, span) => {
        for (const r of s.regions) {
          const at = { page: r.page, calc: c.id, span };
          for (const l of links) add(r.page, { band: l.band, from: c.title, to: `→ ${sourceName(D, l.source)} (${l.role})`, pct: pct(l.confidence), at: { ...at, link: l.id } }, l.id);
          if (!links.length) add(r.page, { band: "none", from: c.title, to: "→ no drawing linked", pct: "", none: true, at }, c.id + "|none");
        }
      });
    }
  }
  return pages;
}

function buildPageNav(host, D, mode, docId, { goToPage, showLink, app, toggleBtn }) {
  const doc = D.doc[docId];
  const byPage = linksByPage(D, mode, docId);
  const onlyLinked = store.get("nav.onlyLinked", mode === "calcs");
  const total = [...byPage.values()].reduce((n, l) => n + l.filter((r) => !r.none).length, 0);

  host.innerHTML = `
    <div class="nav-head"><b>Pages</b><span class="empty" style="font-size:12px">${doc.pages.length} pages · ${total} links</span>
      <button class="tool" data-act="hide" title="Collapse the page list">«</button></div>
    <div class="nav-tools"><button data-act="expand">Expand all</button><button data-act="collapse">Collapse all</button>
      <label><input type="checkbox" data-act="only" ${onlyLinked ? "checked" : ""}> with links only</label></div>
    <div class="nav-list"></div>`;
  const list = host.querySelector(".nav-list");

  const render = (only) => {
    list.innerHTML = doc.pages.map((p) => {
      const rows = byPage.get(p.page) || [];
      if (only && !rows.length) return "";
      const label = mode === "drawings" ? p.label || `p. ${p.page}` : `p. ${p.page}`;
      const title = mode === "drawings" ? p.title || "" : p.label ? `Sheet ${p.label}` : "";
      const n = rows.filter((r) => !r.none).length;
      const items = rows.map((r, i) => `<li class="${r.none ? "none" : ""}" data-i="${i}" title="Show this on the page"><span class="dot b-${r.band}"></span><span class="txt"><span class="from">${esc(r.from)}</span><span class="to" title="${esc(r.to)}">${esc(r.to)}</span></span><span class="pct">${r.pct}</span></li>`).join("");
      return `<details class="pg-item${rows.length ? "" : " empty-page"}" data-page="${p.page}">
        <summary title="Go to ${esc(label)}"><span class="caret" title="Show / hide links"></span><span class="pgl">${esc(label)}</span><span class="pgt">${esc(title)}</span>${rows.length ? `<span class="cnt">${n}</span>` : ""}</summary>
        ${rows.length ? `<ul class="pg-links">${items}</ul>` : ""}</details>`;
    }).join("") || `<div class="empty" style="padding:12px">No pages with links.</div>`;
    setCurrent(current, false);
  };

  // page click navigates (and opens); caret click only toggles
  list.addEventListener("click", (ev) => {
    const li = ev.target.closest(".pg-links li");
    if (li) {
      const row = byPage.get(+li.closest(".pg-item").dataset.page)[+li.dataset.i];
      list.querySelectorAll(".pg-links li.on").forEach((x) => x.classList.remove("on"));
      li.classList.add("on");
      showLink?.(row.at);
      return;
    }
    const sum = ev.target.closest("summary");
    if (!sum) return;
    const det = sum.parentElement;
    if (ev.target.closest(".caret")) return; // default toggle
    ev.preventDefault();
    if (!det.classList.contains("empty-page")) det.open = true;
    goToPage(+det.dataset.page);
  });

  host.querySelector(".nav-tools").addEventListener("click", (ev) => {
    const act = ev.target.dataset.act;
    if (act === "expand" || act === "collapse") list.querySelectorAll(".pg-item:not(.empty-page)").forEach((d) => (d.open = act === "expand"));
  });
  host.querySelector("[data-act=only]").addEventListener("change", (ev) => { store.set("nav.onlyLinked", ev.target.checked); render(ev.target.checked); });

  // collapse / expand the whole sidebar
  const setShown = (shown) => { app.classList.toggle("no-nav", !shown); store.set("nav.shown", shown); toggleBtn?.classList.toggle("on", shown); };
  host.querySelector("[data-act=hide]").addEventListener("click", () => setShown(false));
  if (toggleBtn) toggleBtn.onclick = () => setShown(app.classList.contains("no-nav"));
  setShown(store.get("nav.shown", true));

  let current = 1;
  function setCurrent(p, scroll = true) {
    current = p;
    list.querySelectorAll(".pg-item.cur").forEach((d) => d.classList.remove("cur"));
    const d = list.querySelector(`.pg-item[data-page="${p}"]`);
    if (!d) return;
    d.classList.add("cur");
    if (scroll && !host.matches(":hover")) {
      const r = d.getBoundingClientRect(), lr = list.getBoundingClientRect();
      if (r.top < lr.top || r.bottom > lr.bottom) list.scrollTop += r.top - lr.top - lr.height / 3;
    }
  }
  render(onlyLinked);
  /** Clear the highlighted row (e.g. when something else is selected on the page). */
  const clearRow = () => list.querySelectorAll(".pg-links li.on").forEach((x) => x.classList.remove("on"));
  return { setCurrent, clearRow };
}

// ---- windows.js
// Cross-window routing between the three pages (works over http and when opened from disk).
// openViewer("calcs" | "drawings", params) shows params in an already-open viewer of that kind if there is one,
// otherwise opens a new window. Order:
//   1. a known peer window: one this page opened, or the page that opened this one – told by postMessage
//   2. any open viewer in another tab of this site – found over a BroadcastChannel (served mode)
//   3. a new window (or this tab, if pop-ups are blocked)
const CHANNEL = "bldg12-calcviewer";
let chan = null;
try { chan = "BroadcastChannel" in window ? new BroadcastChannel(CHANNEL) : null; } catch { chan = null; }
const myId = Math.random().toString(36).slice(2);
const myKind = document.body.dataset.mode; // drawings | calcs | index
let lastFocus = document.hasFocus() ? Date.now() : 0;
addEventListener("focus", () => (lastFocus = Date.now()));

const WIN_NAMES = { drawings: "bldg12-drawings", calcs: "bldg12-calcs", index: "bldg12-index" };
const LABEL = { drawings: "drawing viewer", calcs: "calc viewer" };
const peers = {}; // kind -> { win, ready }
let showHandler = null;
let pendingShow = null; // a "show" that arrived while this viewer was still loading (its PDF can take seconds)
const handleShow = (params) => {
  if (showHandler) showHandler(params);
  else pendingShow = params; // keep only the latest step; serveViewer() plays it once the viewer is ready
};

// peers introduce themselves: a page says hello to its opener, and answers hellos
addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.app !== CHANNEL || !e.source) return;
  if (m.type === "hello" || m.type === "hello-ack") {
    peers[m.kind] = { win: e.source, ready: true };
    if (m.type === "hello") e.source.postMessage({ app: CHANNEL, type: "hello-ack", kind: myKind }, "*");
  }
  if (m.type === "show" && m.kind === myKind) {
    handleShow(m.params);
    try { window.focus(); } catch { /* may be refused */ }
    markTitle();
  }
});
try { window.opener?.postMessage({ app: CHANNEL, type: "hello", kind: myKind }, "*"); } catch { /* no opener */ }

/** Called by a viewer page: makes it reachable by name, by message and over the channel. */
function serveViewer(kind, show) {
  window.name = WIN_NAMES[kind];
  showHandler = (params) => { if (params && Object.keys(params).length) show(params); };
  if (pendingShow) { const p = pendingShow; pendingShow = null; showHandler(p); }
  chan?.addEventListener("message", (e) => {
    const m = e.data || {};
    if (m.kind !== kind) return;
    if (m.type === "probe") chan.postMessage({ type: "here", kind, reqId: m.reqId, id: myId, focus: lastFocus });
    if (m.type === "show" && m.target === myId) {
      showHandler(m.params);
      try { window.focus(); } catch { /* browsers may refuse */ }
      toast(`Updated from the ${m.from || "other"} window`);
      markTitle();
    }
  });
}

async function openViewer(kind, params, from = myKind) {
  const clean = Object.fromEntries(Object.entries(params).filter(([, v]) => v !== null && v !== undefined && v !== ""));
  const url = new URL(`${kind}.html?${new URLSearchParams(clean)}`, location.href).href;
  // 1. a known peer
  const p = peers[kind];
  if (p && p.win && !p.win.closed) {
    try {
      if (p.ready) p.win.postMessage({ app: CHANNEL, type: "show", kind, params: clean }, "*");
      else p.win.location.href = url; // still loading: just point it at the new place
      bringToFront(kind, p.win);
      toast(`Shown in the ${LABEL[kind]} window ↗`);
      return "reused";
    } catch { /* fall through */ }
  }
  // 2. a viewer open in some other tab (same site)
  if (chan) {
    const reqId = Math.random().toString(36).slice(2);
    const answers = [];
    const onMsg = (e) => { if (e.data?.type === "here" && e.data.reqId === reqId) answers.push(e.data); };
    chan.addEventListener("message", onMsg);
    chan.postMessage({ type: "probe", kind, reqId });
    await new Promise((r) => setTimeout(r, 180));
    chan.removeEventListener("message", onMsg);
    if (answers.length) {
      const best = answers.sort((a, b) => b.focus - a.focus)[0];
      chan.postMessage({ type: "show", kind, target: best.id, params: clean, from });
      // a page can't bring another tab to the front, so say where it went and offer a window we can focus
      toast(`Shown in the ${LABEL[kind]} that's open in another tab (marked ● in its tab title).`, {
        label: "Open in a new window",
        onClick: () => { const w = window.open(url, "_blank"); if (w) peers[kind] = { win: w, ready: false }; },
      }, 9000);
      return "other-tab";
    }
  }
  // 3. a new window
  const w = window.open(url, WIN_NAMES[kind]);
  if (w) { peers[kind] = { win: w, ready: false }; return "new"; }
  toast(`The browser blocked the new ${LABEL[kind]} window. Allow pop-ups for these pages, then click again.`, {
    label: "Open in this tab instead", onClick: () => { location.href = url; },
  }, 12000);
  return "blocked";
}

// win.focus() only raises pop-up windows; a viewer that opened as a *tab* stays behind, so the step looks like it
// did nothing. Targeting the tab by name with an empty URL activates it (during the click) without reloading it.
function bringToFront(kind, win) {
  try { win.focus(); } catch { /* refused */ }
  try {
    const w = window.open("", WIN_NAMES[kind]);
    if (w && w !== win) w.close(); // name lookup missed and made a blank window: drop it
  } catch { /* refused */ }
}

let titleTimer;
function markTitle() {
  const base = document.title.replace(/^● /, "");
  document.title = "● " + base;
  clearTimeout(titleTimer);
  const clear = () => { document.title = base; };
  if (document.hasFocus()) titleTimer = setTimeout(clear, 4000);
  else addEventListener("focus", () => (titleTimer = setTimeout(clear, 1500)), { once: true });
}

/** Make <a data-open="calcs|drawings" data-params="..."> links route through openViewer (plain clicks only). */
function routeLinks(root = document) {
  root.addEventListener("click", (ev) => {
    const a = ev.target.closest("a[data-open]");
    if (!a || ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) return;
    ev.preventDefault();
    openViewer(a.dataset.open, Object.fromEntries(new URLSearchParams(a.dataset.params || "")));
  });
}

let toastTimer;
function toast(msg, action = null, ms = 2600) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.addEventListener("click", () => { t.classList.remove("on"); action.onClick(); });
    t.appendChild(b);
  }
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), ms);
}

// ---- app.js
// Drawing viewer (drawings.html) and calc viewer (calcs.html, one tab per calc PDF).
// Left: page list. Centre: this window's PDF with clickable items. Right: sidebar for the selected item.
// Following a link opens the *other* viewer (reusing it if it's already open) at the linked bounding box;
// arriving here from the other viewer draws that box on this window's PDF.





const mode = document.body.dataset.mode; // "drawings" | "calcs"
const other = mode === "drawings" ? "calcs" : "drawings";
const $ = (s, r = document) => r.querySelector(s);
const app = $(".app");
const side = $("#side");

let D;
try { D = await loadData(); }
catch (e) { side.innerHTML = `<section><div class="flag">Could not load data: ${esc(e.message)}. Run the build script and serve the repo root over HTTP (see README).</div></section>`; throw e; }
$("#built").textContent = `data built ${D.meta.builtAt.replace("T", " ")} · matcher ${D.meta.matcher}`;

const src = new PdfPane($("#src .pages"), { onPage: () => srcBar() });
const state = { srcDoc: mode === "drawings" ? "plans" : "calcs", sel: null, arrival: null, params: {} };
const visited = new Map();
const visitSet = (key) => (visited.has(key) ? visited.get(key) : visited.set(key, new Set()).get(key));
const linkById = (id) => D.links.find((l) => l.id === id) || null;
const docKind = (docId) => D.doc[docId].kind; // "drawings" | "calcs"

// ------------------------------------------------------------------ bars, tabs, page list
let pageNav = null;
function srcBar() {
  const doc = D.doc[state.srcDoc];
  const p = src.currentPage();
  const lab = pageLabel(D, doc.id, p);
  $("#src .sub").textContent = `p. ${p} / ${doc.pages.length}${lab ? " · " + lab : ""}`;
  const sel = $("#src-jump");
  if (sel && document.activeElement !== sel) sel.value = String(p);
  pageNav?.setCurrent(p);
}

function buildNav() {
  pageNav = buildPageNav($("#pagenav"), D, mode, state.srcDoc, {
    app, toggleBtn: $("#nav-toggle"),
    goToPage: (p) => { src.scrollTo(p, [0, 0, 1, 0], { smooth: false, topMargin: 10 }); srcBar(); },
    showLink: (at) => showLinkHere(at),
  });
  pageNav.setCurrent(src.currentPage(), false);
}

function buildTabs() {
  const host = $("#doctabs");
  if (!host) return;
  const docs = D.documents.filter((d) => d.kind === "calcs");
  host.innerHTML = docs.map((d) => {
    const n = D.calcs.filter((c) => c.doc === d.id).length;
    return `<button role="tab" data-doc="${d.id}" class="${d.id === state.srcDoc ? "on" : ""}" aria-selected="${d.id === state.srcDoc}">${esc(d.title)}<span class="cnt">${d.pages.length} pp · ${n} calcs</span></button>`;
  }).join("");
  host.querySelectorAll("[data-doc]").forEach((b) => b.addEventListener("click", () => { if (b.dataset.doc !== state.srcDoc) openSrcDoc(b.dataset.doc); }));
}

function buildSrcBar() {
  const bar = $("#src .pane-bar");
  const doc = D.doc[state.srcDoc];
  const scoped = new Set(D.elements.map((e) => e.sheet));
  const opts = doc.pages.map((p) => {
    const inScope = mode === "drawings" && scoped.has(p.label);
    const text = mode === "drawings" ? `${p.label}${p.title ? " – " + p.title : ""}${inScope ? "  ●" : ""}` : `p. ${p.page}${p.label ? " · " + p.label : ""}`;
    return `<option value="${p.page}">${esc(text)}</option>`;
  }).join("");
  bar.innerHTML = `<button id="nav-toggle" title="Show / hide the page list">☰</button><span class="title">${esc(doc.title)}</span><span class="sub"></span><span class="grow"></span>
    <button data-act="back" title="Scroll back to the linked box" hidden>↺ Box</button>
    <select id="src-jump" title="Go to page">${opts}</select>
    <button data-z="-1" title="Zoom out">−</button><button data-z="0" title="Fit width">Fit</button><button data-z="1" title="Zoom in">+</button>`;
  $("#src-jump").addEventListener("change", (e) => src.scrollTo(+e.target.value, [0, 0, 1, 0], { smooth: false, topMargin: 10 }));
  bar.querySelectorAll("[data-z]").forEach((b) => b.addEventListener("click", () => {
    const z = +b.dataset.z;
    src.setZoom(z === 0 ? 1 : src.zoom * (z > 0 ? 1.4 : 1 / 1.4));
  }));
  $("[data-act=back]", bar).addEventListener("click", () => state.arrival && scrollToStop(state.arrival.stop));
  srcBar();
}

async function openSrcDoc(docId, page) {
  state.srcDoc = docId;
  await src.open(D.doc[docId].file, docId);
  buildTabs();
  buildSrcBar();
  buildNav();
  paintSource();
  if (state.arrival?.stop.doc === docId) paintArrival(state.arrival.stop, state.arrival.link);
  else { src.setLayer("arrival", []); src.setLayer("marks", []); }
  if (page) src.scrollTo(page, [0, 0, 1, 0], { smooth: false, topMargin: 10 });
}

// ------------------------------------------------------------------ this window's items
function paintSource() {
  const items = [];
  if (mode === "drawings") {
    for (const e of D.elements) {
      const links = linksForElement(D, e);
      const band = bestBand(links);
      const best = bestDesign(links);
      const tip = `${e.tag}${e.grid ? " · grid " + e.grid : ""} — ${best ? `design calc ${pct(best.confidence)} (${best.band})` : "no design calc found"}${links.length ? ` · ${links.length} link${links.length > 1 ? "s" : ""}` : ""}${e.refs?.length ? " · detail sheet " + e.refs[0].sheet : ""}`;
      e.occurrences.forEach((o, k) => {
        if (o.doc !== state.srcDoc) return;
        items.push({
          page: o.page, rect: o.rect, title: tip, attrs: { id: e.id, occ: k },
          cls: `el b-${band}${e.type === "callout" ? " callout" : ""}`,
          on: { click: (ev) => { ev.stopPropagation(); select({ kind: "element", id: e.id, occ: k }); } },
        });
      });
    }
  } else {
    for (const c of D.calcs.filter((c) => c.doc === state.srcDoc)) {
      const band = bestBand(D.linksByCalc[c.id] || []);
      c.spans.forEach((s, si) => {
        const n = s.regions.length;
        const lab = stopLabel(D, { doc: c.doc, regions: s.regions });
        s.regions.forEach((r, ri) => items.push({
          page: r.page, rect: r.rect, attrs: { calc: c.id, span: si },
          cls: `span b-${band}${ri < n - 1 ? " cont-down" : ""}${ri > 0 ? " cont-up" : ""}`,
          html: ri === 0
            ? `<div class="strip">${esc(c.title)}${s.title && s.title !== c.title ? " — " + esc(s.title) : ""} · ${esc(lab.pg)}</div>`
            : `<div class="strip">continued (${lab.a}–${lab.b})</div>`,
          on: { click: (ev) => { ev.stopPropagation(); select({ kind: "calc", id: c.id, span: si }); } },
        }));
      });
    }
  }
  src.setLayer("items", items);
  markSourceSelection();
}

function markSourceSelection() {
  const id = state.sel?.id;
  if (mode === "drawings") src.nodes("items").forEach((n) => n.classList.toggle("sel", n.dataset.id === id));
  else src.nodes("items").forEach((n) => n.classList.toggle("sel", n.dataset.calc === id));
  if (mode === "calcs") {
    const links = state.sel?.kind === "calc" ? D.linksByCalc[id] || [] : [];
    const items = [];
    links.forEach((l) => l.hits.filter((h) => h.doc === state.srcDoc).forEach((h) => items.push({
      page: h.page, rect: h.rect, cls: "hit", title: `${h.text} → ${sourceName(D, l.source)} (click to open it in the drawing viewer)`,
      attrs: { link: l.id },
      on: { click: (ev) => { ev.stopPropagation(); const card = side.querySelector(`.linkcard[data-link="${CSS.escape(l.id)}"]`); card?._stepper?.go((card._stepper.index ?? -1) + 1); card?.scrollIntoView({ block: "nearest", behavior: "smooth" }); } },
    })));
    src.setLayer("hits", items);
  }
}

// ------------------------------------------------------------------ arrival box (a link from the other viewer)
function paintArrival(stop, link) {
  const lab = stopLabel(D, stop);
  const n = stop.regions.length;
  const band = link ? `b-${link.band}` : "b-none";
  src.setLayer("arrival", stop.regions.map((r, i) => ({
    page: r.page, rect: r.rect,
    cls: `tbox ${band}${i === 0 ? " first" : ""}${i === n - 1 ? " last" : ""}${i > 0 && i < n - 1 ? " mid" : ""}${r.fullPage ? " full" : ""}`,
    html: i === 0
      ? `<div class="tlabel"><span class="pg">${esc(lab.short)}</span>${link ? `<span class="conf ${band}" data-why>${pct(link.confidence)} · why?</span>` : ""}<span class="x" data-clear title="Clear this box">×</span></div>`
      : `<div class="ttag">continued (${lab.a}–${lab.b})</div>`,
  })));
  const first = src.nodes("arrival")[0];
  first?.querySelector("[data-clear]")?.addEventListener("click", (ev) => { ev.stopPropagation(); clearArrival(); });
  first?.querySelector("[data-why]")?.addEventListener("click", (ev) => {
    ev.stopPropagation();
    const open = first.querySelector(".why");
    if (open) { open.remove(); return; }
    const w = document.createElement("div");
    w.className = "why";
    w.innerHTML = whyHtml(link);
    w.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) w.remove(); });
    first.appendChild(w);
  });
  const pages = new Set(stop.regions.map((r) => r.page));
  const marks = [];
  if (link && stop.kind === "calc") {
    link.hits.filter((h) => h.doc === stop.doc && h.span === stop.span).forEach((h) => marks.push({ page: h.page, rect: h.rect, cls: "hit", title: h.text }));
  }
  if (link) {
    link.rationale.evidence.filter((e) => e.dest?.rect && e.dest.doc === stop.doc && pages.has(e.dest.page)).forEach((e) =>
      marks.push({ page: e.dest.page, rect: [e.dest.rect[0], e.dest.rect[1]], point: true, cls: "mark", html: String(e.n), title: e.note || e.kind }));
  }
  src.setLayer("marks", marks);
  $("#src [data-act=back]").hidden = false;
}

function clearArrival() {
  state.arrival = null;
  src.setLayer("arrival", []);
  src.setLayer("marks", []);
  $("#src [data-act=back]").hidden = true;
}

function scrollToStop(stop) {
  const r0 = stop.regions[0];
  if (docKind(stop.doc) === "drawings" && !r0.fullPage) src.scrollTo(r0.page, r0.rect, { zoomFor: 0.16, maxZoom: 5, smooth: false, topMargin: src.scroller.clientHeight * 0.4 });
  else if (docKind(stop.doc) === "drawings") { src.setZoom(1, false); src.scrollTo(r0.page, r0.rect, { smooth: false, topMargin: 10 }); }
  else src.scrollTo(r0.page, r0.rect, { smooth: false, topMargin: 64 });
}

async function arrive(stop, link) {
  if (stop.doc !== state.srcDoc) await openSrcDoc(stop.doc);
  state.arrival = { stop, link };
  paintArrival(stop, link);
  scrollToStop(stop);
  srcBar();
}

/** Show params in this window: {el, occ, link} | {sheet} | {calc, span, link} | {doc, page, rect, link} */
async function show(p) {
  state.params = p;
  const link = p.link ? linkById(p.link) : null;
  if (mode === "drawings" && p.el && D.el[p.el]) {
    const e = D.el[p.el];
    const occ = Math.min(+p.occ || 0, e.occurrences.length - 1);
    const o = e.occurrences[occ];
    await select({ kind: "element", id: e.id, occ }, { keepArrival: true });
    await arrive({ kind: "drawing", doc: o.doc, regions: [{ page: o.page, rect: o.rect }] }, link);
  } else if (mode === "drawings" && p.sheet) {
    const page = D.doc.plans.pages.find((x) => x.label === p.sheet)?.page;
    if (page) await arrive({ kind: "sheet", doc: "plans", regions: [{ page, rect: [0.005, 0.005, 0.995, 0.995], fullPage: true }] }, null);
  } else if (mode === "calcs" && p.calc && D.calc[p.calc]) {
    const c = D.calc[p.calc];
    const span = Math.min(+p.span || 0, c.spans.length - 1);
    if (c.doc !== state.srcDoc) await openSrcDoc(c.doc);
    await select({ kind: "calc", id: c.id, span }, { keepArrival: true });
    await arrive({ kind: "calc", doc: c.doc, span, regions: c.spans[span].regions }, link);
  } else if (p.doc && D.doc[p.doc] && docKind(p.doc) === (mode === "drawings" ? "drawings" : "calcs") && p.page) {
    const rect = String(p.rect || "0,0,1,1").split(",").map(Number);
    await arrive({ kind: "point", doc: p.doc, regions: [{ page: +p.page, rect }] }, link);
  }
  writeUrl();
}

// ------------------------------------------------------------------ a page-list link row: show it here, don't follow it
function flash(nodes) {
  src.scroller.querySelectorAll(".ov.flash").forEach((n) => n.classList.remove("flash"));
  nodes.forEach((n) => { void n.offsetWidth; n.classList.add("flash"); });
}

async function showLinkHere(at) {
  const onPage = (n) => +n.closest(".page")?.dataset.page === at.page;
  if (mode === "drawings") {
    const e = D.el[at.el];
    const o = e.occurrences[at.occ];
    await select({ kind: "element", id: e.id, occ: at.occ }, { fromNav: true });
    src.scrollTo(o.page, o.rect, { zoomFor: 0.16, maxZoom: 5, smooth: false, topMargin: src.scroller.clientHeight * 0.4 });
    setTimeout(() => flash(src.nodes("items").filter((n) => n.dataset.id === e.id && +n.dataset.occ === at.occ)), 60);
  } else {
    const c = D.calc[at.calc];
    await select({ kind: "calc", id: c.id, span: at.span }, { fromNav: true });
    // the evidence text for this link on this page if there is any, otherwise the calc's box on this page
    const hits = at.link ? (linkById(at.link)?.hits || []).filter((h) => h.doc === state.srcDoc && h.page === at.page) : [];
    const region = c.spans[at.span].regions.find((r) => r.page === at.page) || c.spans[at.span].regions[0];
    const target = hits[0]?.rect || region.rect;
    src.scrollTo(at.page, target, { smooth: false, topMargin: hits.length ? src.scroller.clientHeight * 0.35 : 50 });
    setTimeout(() => flash(hits.length
      ? src.nodes("hits").filter((n) => n.dataset.link === at.link && onPage(n))
      : src.nodes("items").filter((n) => n.dataset.calc === c.id && +n.dataset.span === at.span && onPage(n))), 60);
  }
  srcBar();
  // point at the matching link card in the sidebar (without following it)
  const key = at.ref ? "ref:" + at.el : at.link;
  const card = key && side.querySelector(`.linkcard[data-link="${CSS.escape(key)}"]`);
  side.querySelectorAll(".linkcard.active").forEach((x) => x.classList.remove("active"));
  if (card) {
    card.classList.add("active");
    const det = card.querySelector("details");
    if (det) det.open = true;
    card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

// ------------------------------------------------------------------ following a link (to the other window)
function follow(stop, link) {
  if (stop.kind === "sheet") return show({ sheet: stop.sheet }); // a drawing sheet: stays in this window
  const params = stop.kind === "calc"
    ? { calc: link.calc, span: stop.span, link: link.id }
    : { el: stop.elId, occ: stop.occ, link: link.id };
  return openViewer(stop.kind === "calc" ? "calcs" : "drawings", params);
}

// ------------------------------------------------------------------ sidebar
function whyHtml(link) {
  const ev = link.rationale.evidence.map((e) => `<li><span class="n${e.weight < 0 ? " neg" : ""}">${e.n}</span><span>${esc(e.note || e.kind)}</span><span class="w">${e.weight > 0 ? "+" : ""}${e.weight.toFixed(2)}</span></li>`).join("");
  const cav = link.rationale.caveats.length ? `<ul class="caveats">${link.rationale.caveats.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : "";
  return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="badge b-${link.band}">${pct(link.confidence)} ${link.band}</span><b style="flex:1">Why this link</b><button class="tool" data-close>×</button></div>
    <div>${esc(link.rationale.summary)}</div><ul class="evid">${ev}</ul>${cav}${provHtml(link)}`;
}

function provHtml(link) {
  const p = link.provenance;
  return `<div class="prov">Found by ${esc(p.method)} (matcher ${esc(p.matcher)}, ${esc(p.at)}) · summary by ${esc(p.summaryBy)} · ${p.reviewed ? "reviewed " + esc(p.reviewed) : "not yet reviewed"}</div>`;
}

function kv(rows) {
  return `<dl class="kv">${rows.filter(([, v]) => v !== undefined && v !== null && v !== "").map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
}

function linkCard({ key, title, sub, link, stops, label, chipText, opensIn }) {
  const card = document.createElement("div");
  card.className = "linkcard";
  card.dataset.link = key;
  const badge = link ? `<span class="badge b-${link.band}">${pct(link.confidence)} ${link.band}</span>` : `<span class="chip">${esc(chipText || "")}</span>`;
  card.innerHTML = `<div class="head"><div class="t">${esc(title)}${sub ? `<div class="empty" style="font-weight:400;font-size:12px">${esc(sub)}</div>` : ""}</div>${badge}</div>
    <div class="stp"></div>${opensIn ? `<div class="opens">${esc(opensIn)}</div>` : ""}`;
  const st = makeStepper({
    count: stops.length, visited: visitSet(key), label: (i) => label(stops[i]),
    onGo: (i) => {
      side.querySelectorAll(".linkcard.active").forEach((c) => c.classList.remove("active"));
      card.classList.add("active");
      follow(stops[i], link);
    },
  });
  card._stepper = st;
  $(".stp", card).appendChild(st.el);
  if (link) {
    const r = link.rationale;
    const ev = r.evidence.map((e) => {
      const nav = e.dest?.rect || e.origin?.rect;
      return `<li class="${nav ? "nav" : ""}" data-n="${e.n}" title="${nav ? "Show this evidence" : ""}"><span class="n${e.weight < 0 ? " neg" : ""}">${e.n}</span><span>${esc(e.note || e.kind)}</span><span class="w">${e.weight > 0 ? "+" : ""}${e.weight.toFixed(2)}</span></li>`;
    }).join("");
    card.insertAdjacentHTML("beforeend", `<div class="summary">${esc(r.summary)}</div>
      <details><summary>Evidence (${r.evidence.length})${r.caveats.length ? ` · ${r.caveats.length} caveat${r.caveats.length > 1 ? "s" : ""}` : ""}</summary>
      <ul class="evid">${ev}</ul>${r.caveats.length ? `<ul class="caveats">${r.caveats.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}${provHtml(link)}</details>`);
    card.querySelectorAll(".evid li.nav").forEach((li) => li.addEventListener("click", async () => {
      const e = r.evidence.find((x) => x.n === +li.dataset.n);
      const where = e.dest?.rect ? e.dest : e.origin;
      const here = docKind(where.doc) === (mode === "drawings" ? "drawings" : "calcs");
      if (!here) { openViewer(other, { doc: where.doc, page: where.page, rect: where.rect.join(","), link: link.id }); return; }
      if (where.doc !== state.srcDoc) await openSrcDoc(where.doc);
      src.scrollTo(where.page, where.rect, docKind(where.doc) === "drawings" ? { zoomFor: 0.16, maxZoom: 5, smooth: false, topMargin: src.scroller.clientHeight * 0.4 } : { topMargin: 80 });
      setTimeout(() => {
        src.nodes("marks").concat(src.nodes("hits"), src.nodes("items"))
          .filter((n) => n.textContent === String(e.n) || n.title?.startsWith(where.text))
          .forEach((n) => { n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash"); });
      }, 350);
    }));
  }
  return card;
}

function renderSide() {
  side.innerHTML = "";
  const sel = state.sel;
  if (!sel) {
    side.innerHTML = mode === "drawings"
      ? `<section><h2>Drawings → calcs</h2><p>Click any highlighted element on the drawing. The sidebar lists the calcs it links to. Following a link opens the <b>calc viewer</b> window at that calc's bounding box, or reuses it if it's already open.</p>
         <p><span class="badge b-high">high</span> <span class="badge b-medium">medium</span> <span class="badge b-low">low</span> <span class="badge b-none">no calc</span> — box colour shows the best design link's confidence. Dashed circles are detail callouts.</p>
         <p class="empty">In scope: ${[...new Set(D.elements.map((e) => e.sheet))].join(", ")} (marked ● in the sheet list).</p></section>`
      : `<section><h2>Calcs → drawings</h2><p>Click a calc box on the page. The sidebar lists the drawn elements it designs. Following a link opens the <b>drawing viewer</b> window at that element, or reuses it if it's already open. Yellow marks are the text that supports a link.</p>
         <p class="empty">Each calc PDF has its own tab above the page.</p></section>`;
    return;
  }
  if (sel.kind === "element") renderElementSide(D.el[sel.id], sel.occ ?? 0);
  else renderCalcSide(D.calc[sel.id], sel.span ?? 0);
}

function renderElementSide(e, occIdx) {
  const links = linksForElement(D, e);
  const g = e.group ? D.group[e.group] : null;
  const s1 = document.createElement("section");
  s1.innerHTML = `<h3>${esc(e.type)}</h3><h2>${esc(e.tag)}</h2>
    ${kv([["Grid", esc(e.grid)], ["Sheet", esc(e.sheet)], ["View", esc(e.view)], ["Level", esc(e.level)],
      ["IFC", e.ifc ? `<code>${esc(e.ifc.class)}${e.ifc.predefinedType ? "." + esc(e.ifc.predefinedType) : ""}</code>` : ""],
      ["Typical group", g && g.members.length > 1 ? `${esc(g.title)} · ${g.members.length} members` : ""], ["ID", `<code>${esc(e.id)}</code>`]])}`;
  side.appendChild(s1);
  if (e.occurrences.length > 1) {
    const s = document.createElement("section");
    s.innerHTML = `<h3>On the drawings</h3>`;
    const st = makeStepper({ count: e.occurrences.length, index: occIdx, visited: visitSet("occ:" + e.id), label: (i) => `${e.occurrences[i].sheet} · ${e.occurrences[i].view}`,
      onGo: (i) => { const o = e.occurrences[i]; src.scrollTo(o.page, o.rect, { zoomFor: 0.16, maxZoom: 5, smooth: false, topMargin: src.scroller.clientHeight * 0.4 }); } });
    s.appendChild(st.el);
    side.appendChild(s);
  }
  const s2 = document.createElement("section");
  s2.innerHTML = `<h3>Linked calcs (${links.length})</h3>`;
  if (e.refs?.length) {
    s2.appendChild(linkCard({ key: "ref:" + e.id, title: `Detail sheet ${e.refs[0].sheet}`, sub: e.refs[0].title, stops: refStops(D, e), chipText: "callout",
      label: (s) => stopLabel(D, s).short, opensIn: "Opens in this window" }));
  }
  if (!links.some((l) => l.role === "design")) s2.insertAdjacentHTML("beforeend", `<div class="flag">No design calc found for this element. ${e.type === "callout" ? "No calc names this detail." : "No calc in the packages sizes this member on this level."} Flagged for review.</div>`);
  for (const l of links) {
    const c = D.calc[l.calc];
    s2.appendChild(linkCard({
      key: l.id, link: l, stops: calcStops(D, l), title: c.title,
      sub: `${l.role}${l.source.kind === "group" ? " · via typical group" : ""} · ${c.sheetRange ? "sheets " + c.sheetRange : D.doc[c.doc].title}`,
      label: (s) => `${stopLabel(D, s).short}${s.title && s.title !== c.title ? " · " + s.title : ""}`,
      opensIn: `Opens in the calc viewer ↗ (${c.doc === "stair" ? "stair & parapet" : "calc package"} tab)`,
    }));
  }
  side.appendChild(s2);
}

function renderCalcSide(c, spanIdx) {
  const links = (D.linksByCalc[c.id] || []).slice().sort((a, b) => b.confidence - a.confidence);
  const s1 = document.createElement("section");
  const f = c.fields;
  s1.innerHTML = `<h3>${esc(c.category)}</h3><h2>${esc(c.title)}</h2>
    ${c.description ? `<p>${esc(c.description)}</p>` : ""}
    ${kv([["Sheets", esc(c.sheetRange || "–")], ["PDF pages", `${c.pageRange[0]}–${c.pageRange[1]}`], ["Document", esc(D.doc[c.doc].title)],
      ["Software", esc(f.software)], ["Level", esc(f.level)], ["Grids", esc(f.gridSystem || (f.grids || []).join(", "))],
      ["Sizes", esc((f.sizes || []).slice(0, 14).join(", ") + ((f.sizes || []).length > 14 ? " …" : ""))],
      ["Detail refs", esc((f.detailRefs || []).join(", "))], ["ID", `<code>${esc(c.id)}</code>`]])}`;
  side.appendChild(s1);
  const sp = document.createElement("section");
  sp.innerHTML = `<h3>In this PDF (${c.spans.length} part${c.spans.length > 1 ? "s" : ""})</h3>`;
  const spanStops = c.spans.map((s, i) => ({ doc: c.doc, regions: s.regions, title: s.title, span: i }));
  const st = makeStepper({ count: spanStops.length, index: spanIdx, visited: visitSet("span:" + c.id), label: (s) => `${stopLabel(D, spanStops[s]).short}${spanStops[s].title ? " · " + spanStops[s].title : ""}`,
    onGo: (i) => { const r = spanStops[i].regions[0]; src.scrollTo(r.page, r.rect, { topMargin: 50 }); } });
  sp.appendChild(st.el);
  side.appendChild(sp);
  const s2 = document.createElement("section");
  s2.innerHTML = `<h3>On the drawings (${links.length} link${links.length === 1 ? "" : "s"})</h3>`;
  if (!links.length) s2.insertAdjacentHTML("beforeend", `<div class="flag">No drawn element is linked to this calc yet.</div>`);
  for (const l of links) {
    const stops = drawingStops(D, l);
    s2.appendChild(linkCard({
      key: l.id, link: l, stops, title: sourceName(D, l.source),
      sub: `${l.role} · ${l.source.kind === "group" ? `typical group, ${stops.length} places` : stops.length + " place" + (stops.length > 1 ? "s" : "")} on the drawings`,
      label: (s) => `${stopLabel(D, s).short} · ${s.title}`, opensIn: "Opens in the drawing viewer ↗",
    }));
  }
  side.appendChild(s2);
}

// ------------------------------------------------------------------ selection + URL
async function select(sel, { keepArrival = false, fromNav = false } = {}) {
  state.sel = sel;
  if (!fromNav) pageNav?.clearRow();
  if (!keepArrival) { clearArrival(); state.params = sel.kind === "element" ? { el: sel.id, occ: sel.occ } : { calc: sel.id, span: sel.span }; }
  if (sel.kind === "calc" && D.calc[sel.id].doc !== state.srcDoc) await openSrcDoc(D.calc[sel.id].doc);
  markSourceSelection();
  renderSide();
  writeUrl();
}

function writeUrl() {
  const p = new URLSearchParams(Object.entries(state.params || {}).filter(([, v]) => v !== undefined && v !== null && v !== ""));
  if (!p.toString()) p.set("doc", state.srcDoc);
  try { history.replaceState(null, "", "?" + p.toString()); } catch { /* some browsers refuse this for file:// pages */ }
}

// ------------------------------------------------------------------ start
serveViewer(mode, (params) => show(params));
routeLinks();
const q = Object.fromEntries(new URLSearchParams(location.search));
if (mode === "drawings") {
  const start = D.doc.plans.pages.find((p) => p.label === "S2.0.3")?.page || 1;
  await openSrcDoc("plans", q.el || q.sheet || q.page ? null : start);
} else {
  const c = D.calc[q.calc];
  const docId = c ? c.doc : D.doc[q.doc]?.kind === "calcs" ? q.doc : "calcs";
  await openSrcDoc(docId);
  if (!c && !q.page) { const first = D.calcs.find((x) => x.doc === state.srcDoc); if (first) src.scrollTo(first.spans[0].regions[0].page, [0, 0, 1, 0], { smooth: false, topMargin: 10 }); }
}
renderSide();
if (q.el || q.sheet || q.calc || q.page) await show(q);

</script>
