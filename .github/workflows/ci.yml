# CI for the repo: a frontend-only Vite + React app at the root (workspace packages in packages/, incl. the calc
# engine packages/calc-mapper) plus offline Python tooling in tools/calcgraph-reference/ that scores the engine.
# Actions pinned to commit SHAs (tag in the comment) - same pins as the calc-graph hackathon CI.
# The copyrighted drawing-set PDFs and hand labels are never in CI: evaluate_all runs --synthetic-only,
# and the copyright guard runs over HEAD and over the new commits (a PR's, or a push's), merges included.
name: CI

on:
  pull_request:
  push:
    branches: [prod, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # the guard walks the new commits
      - name: Copyright guard (self-test, every tracked file, the new commits)
        # stdlib only, so the runner's python3 is enough; it scans the whole repo. This job is the only
        # place the guard runs in CI (evaluate_all has no copyright stage); a test in tests/ pins that it
        # keeps running --self-test, --tracked and the PR / push scan.
        # A push is scanned over what it INTRODUCES (check_no_copyrighted.py push_spec): before..sha for
        # an update (a force-push's old head is fetched by sha), origin/prod..sha for a new branch. If that
        # cannot be determined, the tree is scanned and a ::warning:: says the history was not. Never the
        # full history: prod's history predates the guard (unpinned screenshots, .DS_Store versions under
        # one path) and is already public, so it is neither rewritten nor allowlisted.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          guard=tools/calcgraph-reference/scripts/check_no_copyrighted.py
          python3 "$guard" --self-test
          python3 "$guard" --tracked
          if [ "$EVENT" = "pull_request" ]; then
            python3 "$guard" --range "origin/$BASE_REF..HEAD"
          elif [ "$EVENT" = "push" ]; then
            python3 "$guard" --push "$BEFORE" "$GITHUB_SHA" --base origin/prod --ref "$REF_NAME"
          fi

  tooling:
    # proves the in-browser calc engine is at least as good as the baseline: synthetic fixtures ->
    # element graphs (the UI's packages) -> packages/calc-mapper (Node CLI) -> scorer, gated on eval/baseline.json
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/calcgraph-reference
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
        with:
          version: "0.11.16"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.23.0"  # >= 22.18: runs the packages' .ts sources with type stripping
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci (repo root - workspace packages, web-ifc, pdfjs-dist)
        working-directory: .
        run: npm ci
      - name: uv sync
        run: uv sync --frozen --extra dev
      - name: Synthetic generator is byte-stable (also writes data/synthetic)
        run: uv run python -m synth.generate --check
      - name: Element graphs of the synthetic model revisions
        run: >-
          node scripts/build_graph.mjs
          data/synthetic/model_rev1.ifc data/synthetic/model_rev1.graph.json
          data/synthetic/model_rev2.ifc data/synthetic/model_rev2.graph.json
      - name: Calc engine CLI smoke run (the gate below runs the engine itself, through scripts/evaluate.py)
        # proves run-pipeline.ts runs end to end on the synthetic package; its output is not read by
        # anything, so it goes to the runner's temp dir
        working-directory: .
        run: >-
          node packages/calc-mapper/scripts/run-pipeline.ts
          --graph tools/calcgraph-reference/data/synthetic/model_rev1.graph.json
          --pdf tools/calcgraph-reference/data/synthetic/calc_package.pdf
          --compare-to tools/calcgraph-reference/data/synthetic/model_rev2.graph.json
          --out "$RUNNER_TEMP/engine_rev1.json"
      - name: Tooling tests
        run: uv run --extra dev pytest tests -q
      - name: Evaluate (synthetic only, gated on eval/baseline.json; move_answer_key is local-only, see the README)
        run: uv run python scripts/evaluate_all.py --synthetic-only
      - name: Scorecard artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scorecard
          path: |
            tools/calcgraph-reference/data/eval/scorecard.json
            tools/calcgraph-reference/data/eval/latest.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck   # app + every workspace package (incl. packages/calc-mapper)
      - run: npm test            # app vitest + every workspace package's vitest
      - run: npm run build
