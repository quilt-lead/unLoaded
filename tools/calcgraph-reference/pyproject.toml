[project]
name = "calcgraph-reference"
version = "0.1.0"
requires-python = ">=3.12"
description = "Offline dev tooling for the calc engine (packages/calc-mapper): synthetic fixture generator, scorer, copyright guard"
dependencies = [
    # synth/: writes the synthetic model (IFC), member forces and calc package (PDF)
    "ifcopenshell>=0.9.0.post1",
    "matplotlib>=3.11.2",       # synth/calc_pdf.py: mathtext formula images, scanned hand-calc raster
    "numpy>=2.5.4",
    "pillow>=13.0.0",           # synth/calc_pdf.py
    "pymupdf>=2.1",             # synth/calc_pdf.py writes the calc package
    "pynitefea>=3.2.1",         # synth/analysis.py (member forces for the synthetic calcs)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
