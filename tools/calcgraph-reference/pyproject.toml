[project]
name = "calc-graph"
version = "0.1.0"
requires-python = ">=3.12"
description = "Map a structural BIM element graph to its calc package graph (mapper-v1 backend)"
dependencies = [
    "fastapi>=0.163.0",
    "ifcopenshell>=0.9.0.post1",
    "matplotlib>=3.11.2",       # synth/calc_pdf.py: mathtext formula images, scanned hand-calc raster
    "numpy>=2.5.4",
    "pillow>=13.0.0",           # synth/calc_pdf.py
    "pint==0.25.3",             # calcgraph/schema/units.py
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pynitefea>=3.2.1",         # synth/analysis.py (member forces for the synthetic calcs)
    "python-multipart>=0.0.33", # FastAPI File / Form uploads
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
calc-graph = "calcgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calcgraph", "synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
